name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit (Unit suite)
        run: ./vendor/bin/phpunit --testsuite Unit --exclude-group integration --no-coverage

      - name: PHPStan (src)
        run: ./vendor/bin/phpstan analyse --configuration phpstan.neon --memory-limit=512M --no-progress

      - name: PHPStan (tests)
        run: ./vendor/bin/phpstan analyse --configuration phpstan-tests.neon --memory-limit=512M --no-progress

      - name: PHP CS Fixer (dry-run)
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff
